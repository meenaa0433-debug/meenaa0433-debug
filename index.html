<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}
.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding-bottom:85px;
}
header{
  background:linear-gradient(135deg,#111827,#273c75);
  color:white;
  padding:25px 20px 30px;
  border-radius:0 0 25px 25px;
}
.logo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:22px;
  font-weight:bold;
}
.logo span{font-size:13px;opacity:.8}
.balance{
  margin-top:25px;
  font-size:34px;
  font-weight:bold;
}
.small{font-size:13px;opacity:.75;margin-top:5px}

.section{padding:20px}
.section h2{font-size:18px;margin-bottom:13px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.card{
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:18px 12px;
  background:white;
  box-shadow:0 5px 18px #0000000a;
  cursor:pointer;
}
.card:active{transform:scale(.98)}
.icon{font-size:27px;margin-bottom:10px}
